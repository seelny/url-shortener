    server {
        listen 80;
        server_name localhost;

        location / {
        root /usr/share/nginx/html;
        index index.html;
        }

        location /shorten {
        proxy_pass http://springboot-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        }

        location /stats/ {
        proxy_pass http://springboot-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        }

        location /r/ {
        proxy_pass http://springboot-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        }

}
